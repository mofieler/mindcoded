# Coolify uses Nixpacks by default. Only the major Node version is honored
# unless nixpkgsArchive is pinned — 22.13.0 in NIXPACKS_NODE_VERSION is ignored
# and often becomes 22.11.0, which Nuxt 3.21 rejects.
[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_OPTIONS = "--max-old-space-size=2048"
NUXT_DEVTOOLS = "false"

# nixpkgs commit that provides Node 22.13.1 (Nuxt needs >= 22.12.0)
[phases.setup]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.install]
cmds = ["sh scripts/coolify-install.sh"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node .output/server/index.mjs"
