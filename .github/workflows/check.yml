# Prüft jeden Push und Pull Request: Python-Linter (Ruff), alle Tests inkl. Browser und WCAG-Prüfung (axe), echter
# PHP-Endpunkt mit SMTP-Test, JavaScript-Typprüfung und ob design-tokens.json aktuell ist.
# Lokal dasselbe: python tools/check.py
name: Prüfen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ruff installieren (Version fest, damit neue Regeln nicht überraschend brechen)
        run: pip install ruff==0.17.2
      - name: Design Tokens aktuell
        run: python tools/export_tokens.py --check
      - name: Alle Prüfungen
        env:
          MC_BROWSER: /usr/bin/google-chrome
        run: python tools/check.py
